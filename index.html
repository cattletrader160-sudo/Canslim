<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAN SLIM</title>
<meta name="theme-color" content="#0f1714">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1714; --card: #17211d; --card2: #1d2a25; --line: #26352f;
    --text: #e8f2ee; --muted: #8fa39b; --accent: #34d399; --accent-dim: #134e3a;
    --amber: #fbbf24; --red: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f7f5; --card: #ffffff; --card2: #eef3f0; --line: #dde6e1;
      --text: #10201a; --muted: #5d7068; --accent: #059669; --accent-dim: #d1fae5;
      --amber: #b45309; --red: #dc2626;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .updated { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    width: 42px; height: 42px; border-radius: 12px; font-size: 20px; cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 16px 0 12px;
          background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 9px 0;
                 border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button.on { background: var(--accent-dim); color: var(--text); }

  .market { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px;
            border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; }
  .market b { display: block; }
  .market small { color: var(--muted); }
  .market .warn { color: var(--red); display: block; margin-top: 3px; font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          margin-bottom: 10px; overflow: hidden; }
  .card-main { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center;
               padding: 12px 14px; cursor: pointer; width: 100%; border: 0; background: none;
               color: inherit; font: inherit; text-align: left; }
  .rank { color: var(--muted); font-weight: 700; font-size: 15px; text-align: center; }
  .tk { font-weight: 800; font-size: 17px; letter-spacing: .3px; }
  .nm { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { font-weight: 800; font-size: 15px; padding: 4px 9px; border-radius: 999px;
           background: var(--accent-dim); color: var(--text); white-space: nowrap; }
  .score.full { background: var(--accent); color: #062b1e; }
  .letters { display: flex; gap: 4px; margin-top: 6px; }
  .letters i { font-style: normal; font-size: 11.5px; font-weight: 800; width: 21px; height: 21px;
               display: grid; place-items: center; border-radius: 6px;
               background: var(--card2); color: var(--muted); opacity: .55; }
  .letters i.y { background: var(--accent); color: #062b1e; opacity: 1; }
  .quick { display: flex; gap: 14px; padding: 0 14px 12px 52px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
  .quick b { color: var(--text); font-weight: 600; }
  .detail { display: none; border-top: 1px solid var(--line); padding: 10px 14px 12px; background: var(--card2); }
  .card.open .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .detail div { font-size: 13px; color: var(--muted); }
  .detail div b { display: block; color: var(--text); font-size: 15px; }
  .pos { color: var(--accent) !important; } .neg { color: var(--red) !important; }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 16px; }
  summary { padding: 13px 14px; font-weight: 600; cursor: pointer; }
  .legend { padding: 0 14px 12px; }
  .legend p { margin: 7px 0; font-size: 13.5px; color: var(--muted); }
  .legend p b { color: var(--text); display: inline-block; width: 20px; }
  .msg { text-align: center; color: var(--muted); padding: 40px 16px; }
  .msg b { color: var(--text); display: block; margin-bottom: 6px; font-size: 16px; }
  footer { color: var(--muted); font-size: 11.5px; text-align: center; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>CAN <span>SLIM</span></h1>
      <div class="updated" id="updated">Loading…</div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Refresh">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="tabs" id="tabs">
    <button data-m="asx">ASX 200</button>
    <button data-m="us">US · S&amp;P 500</button>
  </div>

  <div id="content"></div>

  <details>
    <summary>What the letters mean</summary>
    <div class="legend" id="legend"></div>
  </details>

  <footer>
    Screened from free Yahoo Finance data, which can have gaps or errors.<br>
    A dim letter means not met <i>or</i> no data. General information, not financial advice.
  </footer>
</div>

<script>
const LETTERS = "CANSLI";
const DEFAULT_LEGEND = {
  C: "Quarterly EPS up 25%+ year on year",
  A: "Annual EPS growth 25%+ a year, no down years",
  N: "Within 15% of 52-week high, above 50-day average",
  S: "More volume on up days than down days (50 days), liquid",
  L: "Relative strength rating 80+",
  I: "Institutions hold 20%+ of shares",
  M: "Index above its 50- and 200-day averages",
};
let data = null;
let market = "asx";
try { market = localStorage.getItem("canslim-market") || "asx"; } catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, suffix = "", digits = 1) =>
  v === null || v === undefined ? "–" : Number(v).toFixed(digits) + suffix;
const signed = (v, suffix = "%") =>
  v === null || v === undefined ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(1) + suffix;
const cls = (v) => (v === null || v === undefined ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "");

function timeAgo(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const when = d.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short",
                                             hour: "numeric", minute: "2-digit" });
  const hrs = (Date.now() - d) / 36e5;
  const ago = hrs < 1 ? "just now" : hrs < 24 ? Math.round(hrs) + "h ago" : Math.round(hrs / 24) + "d ago";
  return `Updated ${when} · ${ago}`;
}

function renderTabs() {
  for (const b of $("tabs").querySelectorAll("button")) {
    b.classList.toggle("on", b.dataset.m === market);
  }
}

function renderLegend() {
  const t = (data && data.thresholds) || DEFAULT_LEGEND;
  $("legend").innerHTML = [..."CANSLIM"].map((k) =>
    `<p><b>${k}</b>${esc(t[k] || DEFAULT_LEGEND[k])}</p>`).join("") +
    `<p style="margin-top:10px">Stocks are ranked by how many of C, A, N, S, L and I they pass (out of 6), then by relative strength. M is shown in the banner because it applies to the whole market.</p>`;
}

function renderMarket() {
  const box = $("content");
  if (!data) return;
  const m = data.markets && data.markets[market];
  if (!m) {
    box.innerHTML = `<div class="msg"><b>No ${market === "asx" ? "ASX" : "US"} results yet</b>The screen for this market hasn't finished. Check back after the next run.</div>`;
    return;
  }
  const colour = { Uptrend: "var(--accent)", Mixed: "var(--amber)", Downtrend: "var(--red)" }[m.index_status] || "var(--muted)";
  let html = `<div class="market"><span class="dot" style="background:${colour}"></span><div>
      <b>M · ${esc(m.name)}: ${esc(m.index_status)}</b>
      <small>${esc(m.index_detail)} · ${m.screened} stocks screened</small>
      ${m.index_status === "Downtrend" ? '<span class="warn">CAN SLIM says avoid new buys while the market is in a downtrend.</span>' : ""}
    </div></div>`;

  if (!m.top || !m.top.length) {
    html += `<div class="msg"><b>No stocks made the list</b>Try again after the next run.</div>`;
  }
  for (const s of m.top || []) {
    const tk = s.ticker.replace(/\.AX$/, "");
    const letters = [...LETTERS].map((k) => `<i class="${s.passes[k] ? "y" : ""}">${k}</i>`).join("");
    html += `<div class="card">
      <button class="card-main" aria-expanded="false">
        <span class="rank">${s.rank}</span>
        <span style="min-width:0">
          <div class="tk">${esc(tk)}</div>
          <div class="nm">${esc(s.name)}</div>
          <div class="letters">${letters}</div>
        </span>
        <span class="score ${s.score === 6 ? "full" : ""}">${s.score}/6</span>
      </button>
      <div class="quick">
        <span>Price <b>${num(s.price, "", 2)}</b></span>
        <span>RS <b>${s.rs ?? "–"}</b></span>
        <span>Off high <b>${num(s.pct_below_high, "%")}</b></span>
      </div>
      <div class="detail">
        <div>Quarterly EPS growth<b class="${cls(s.qtr_eps_growth)}">${signed(s.qtr_eps_growth)}</b></div>
        <div>Annual EPS growth / yr<b class="${cls(s.annual_eps_cagr)}">${signed(s.annual_eps_cagr)}</b></div>
        <div>12-month return<b class="${cls(s.return_12m)}">${signed(s.return_12m)}</b></div>
        <div>Return on equity<b>${num(s.roe, "%")}</b></div>
        <div>Up/down volume<b>${num(s.updown_vol, "×", 2)}</b></div>
        <div>Held by institutions<b>${num(s.inst_held, "%")}</b></div>
      </div>
    </div>`;
  }
  box.innerHTML = html;
  for (const btn of box.querySelectorAll(".card-main")) {
    btn.addEventListener("click", () => {
      const card = btn.parentElement;
      card.classList.toggle("open");
      btn.setAttribute("aria-expanded", card.classList.contains("open"));
    });
  }
}

async function load() {
  const btn = $("refresh");
  btn.classList.add("spin");
  try {
    const res = await fetch("results.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
    $("updated").textContent = timeAgo(data.generated_at);
  } catch (e) {
    if (!data) {
      $("updated").textContent = "No results yet";
      $("content").innerHTML = `<div class="msg"><b>No results yet</b>The first screen hasn't run. On GitHub, open <i>Actions → CAN SLIM screen → Run workflow</i>, wait about 10 minutes, then tap refresh.</div>`;
    } else {
      $("updated").textContent = timeAgo(data.generated_at) + " · offline";
    }
  } finally {
    btn.classList.remove("spin");
  }
  renderLegend();
  renderMarket();
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  market = b.dataset.m;
  try { localStorage.setItem("canslim-market", market); } catch (err) {}
  renderTabs();
  renderMarket();
});
$("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

renderTabs();
renderLegend();
load();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
